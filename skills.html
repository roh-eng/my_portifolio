<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skills | Portfolio</title>
    <link rel="stylesheet" href="style1.css">
</head>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const toggle = document.getElementById("themeToggle");

    // Apply saved theme on page load
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
        document.body.classList.add("dark");
        toggle.textContent = "☀️";
    }

    toggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        const isDark = document.body.classList.contains("dark");

        toggle.textContent = isDark ? "☀️" : "🌙";
        localStorage.setItem("theme", isDark ? "dark" : "light");
    });
});
</script>


<body>

<header class="navbar">
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a class="active" href="skills.html">Skills</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
<button class="back-btn" onclick="history.back()">← Back</button>
<button id="themeToggle" class="theme-btn">🌙</button>

    </nav>
</header>

<section>
    <h2>Technical Skills</h2>

    <div class="skills-buttons">
        <button onclick="openModal('HTML')">HTML</button>
        <button onclick="openModal('CSS')">CSS</button>
        <button onclick="openModal('JavaScript')">JavaScript</button>
        <button onclick="openModal('React')">React</button>
        <button onclick="openModal('Git')">Git & GitHub</button>
    </div>
</section>

<!-- MODAL -->
<div id="skillModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle"></h3>
        <div id="modalBody"></div>
    </div>
</div>

<script>
const certifications = {
    "HTML": ["images/html-cert.jpg"],
    "CSS": [],
    "JavaScript": ["images/js-cert.jpg"],
    "React": [],
    "Git": []
};

function openModal(skill) {
    const modal = document.getElementById("skillModal");
    const title = document.getElementById("modalTitle");
    const body = document.getElementById("modalBody");

    title.textContent = skill + " Certifications";
    body.innerHTML = "";

    if (certifications[skill] && certifications[skill].length > 0) {
        certifications[skill].forEach(src => {
            const img = document.createElement("img");
            img.src = src;
            img.className = "cert-img";
            body.appendChild(img);
        });
    } else {
        body.innerHTML = `
            <div class="no-cert">
                <img src="images/no-cert.png" alt="No Certificate">
                <p>Certificates will be uploaded soon. Thank you for your understanding.</p>
            </div>
        `;
    }

    modal.classList.add("show");
}

function closeModal() {
    document.getElementById("skillModal").classList.remove("show");
}
</script>

</body>
</html>
